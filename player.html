<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玩家個人數據分析</title>
  <!-- 載入 Chart.js 繪製趨勢圖 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f1923;
      color: #ece8e1;
      margin: 0;
      padding: 30px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .back-btn {
      color: #ff4655;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
    }
    .player-header {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #1f2326;
      padding: 20px;
      border-radius: 8px;
      border-left: 5px solid #ff4655;
      margin-bottom: 30px;
    }
    .player-header h2 { margin: 0; font-size: 28px; }
    
    /* 折線圖區塊 */
    .chart-box {
      background: #1f2326;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    /* 歷史戰績卡片 */
    .section-title {
      color: #ff4655;
      border-bottom: 2px solid #36393e;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .match-card {
      background: #1f2326;
      border-radius: 6px;
      padding: 15px 20px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 6px solid #888;
    }
    .match-card.win { border-left-color: #00da7d; }
    .match-card.loss { border-left-color: #ff4655; }
    .tag-win { color: #00da7d; font-weight: bold; }
    .tag-loss { color: #ff4655; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-btn">← 返回戰隊名單</a>

    <div class="player-header">
      <div>
        <h2 id="player-title">載入中...</h2>
        <div style="color: #888;" id="player-sub">Riot ID</div>
      </div>
    </div>

    <!-- 成長趨勢圖 -->
    <div class="chart-box">
      <h3 style="margin-top: 0;">每日爆頭率 & 勝率成長趨勢 (從 8/2 起)</h3>
      <canvas id="trendChart" height="100"></canvas>
    </div>

    <!-- 歷史對戰紀錄 -->
    <h3 class="section-title">最近 20 場競賽對戰紀錄</h3>
    <div id="match-history-list">
      <!-- JavaScript 會自動動態載入 -->
    </div>
  </div>

  <script>
    // 保存圖表實例以防重複繪製產生警告
    let trendChartInstance = null;

    // 取得 URL 網址參數中的 name 與 tag
    const urlParams = new URLSearchParams(window.location.search);
    const name = urlParams.get('name');
    const tag = urlParams.get('tag');

    if (name && tag) {
      document.getElementById('player-title').innerText = name;
      document.getElementById('player-sub').innerText = `#${tag}`;
      loadTrendData(name, tag);
      loadHistoryData(name, tag);
    }

    // 1. 載入並繪製折線圖 (僅顯示 2026-08-02 起的數據)
    async function loadTrendData(name, tag) {
      try {
        const res = await fetch(`https://crocooemon-cup.onrender.com/api/player/${encodeURIComponent(name)}/${encodeURIComponent(tag)}/trend`);
        const data = await res.json();

        // 前端過濾：只保留 2026-08-02 之後（含）的日期與對應數值
        const startDate = "2026-08-02";
        const filteredDates = [];
        const filteredHsRates = [];
        const filteredWinRates = [];

        if (data.dates && data.dates.length > 0) {
          data.dates.forEach((dateStr, index) => {
            if (dateStr >= startDate) {
              filteredDates.push(dateStr);
              filteredHsRates.push(data.hs_rates[index]);
              filteredWinRates.push(data.win_rates[index]);
            }
          });
        }

        const ctx = document.getElementById('trendChart').getContext('2d');

        if (trendChartInstance) {
          trendChartInstance.destroy();
        }

        trendChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: filteredDates.length > 0 ? filteredDates : ['尚無 8/2 後數據'],
            datasets: [
              {
                label: '平均爆頭率 (%)',
                data: filteredHsRates.length > 0 ? filteredHsRates : [0],
                borderColor: '#ff4655',
                backgroundColor: 'rgba(255, 70, 85, 0.1)',
                fill: true,
                tension: 0.3
              },
              {
                label: '勝率 (%)',
                data: filteredWinRates.length > 0 ? filteredWinRates : [0],
                borderColor: '#00da7d',
                backgroundColor: 'rgba(0, 218, 125, 0.1)',
                fill: true,
                tension: 0.3
              }
            ]
          },
          options: {
            responsive: true,
            scales: {
              y: { beginAtZero: true, max: 100 }
            }
          }
        });
      } catch (err) {
        console.error("無法載入趨勢圖:", err);
      }
    }

    // 2. 載入最近歷史對戰 (依時間降序排序)
    async function loadHistoryData(name, tag) {
      try {
        const res = await fetch(`https://crocooemon-cup.onrender.com/api/player/${encodeURIComponent(name)}/${encodeURIComponent(tag)}/history`);
        let matches = await res.json();

        const listContainer = document.getElementById('match-history-list');
        listContainer.innerHTML = '';

        if (!matches || matches.length === 0) {
          listContainer.innerHTML = '<div style="color: #888;">尚無歷史對戰紀錄數據</div>';
          return;
        }

        // 💡 核心改動：按開賽時間由最新到最舊排序
        matches.sort((a, b) => new Date(b.game_time) - new Date(a.game_time));

        matches.forEach(m => {
          const isWin = m.result === '勝利';

          // 格式化日期與時間為當地標準格式 (YYYY/MM/DD HH:MM)
          let formattedTime = '';
          if (m.game_time) {
            const d = new Date(m.game_time);
            if (!isNaN(d.getTime())) {
              const year = d.getFullYear();
              const month = String(d.getMonth() + 1).padStart(2, '0');
              const day = String(d.getDate()).padStart(2, '0');
              const hours = String(d.getHours()).padStart(2, '0');
              const minutes = String(d.getMinutes()).padStart(2, '0');
              formattedTime = `${year}/${month}/${day} ${hours}:${minutes}`;
            } else {
              formattedTime = m.game_time;
            }
          }

          listContainer.innerHTML += `
            <div class="match-card ${isWin ? 'win' : 'loss'}">
              <div>
                <strong style="font-size: 18px;">${m.map}</strong> 
                <span style="color: #aaa; font-size: 14px;">(${m.agent})</span>
                <div style="font-size: 12px; color: #666; margin-top: 4px;">${formattedTime}</div>
              </div>
              <div>
                <span class="${isWin ? 'tag-win' : 'tag-loss'}">${m.result}</span>
              </div>
              <div>
                <div>KDA: <strong>${m.kda}</strong></div>
                <div style="font-size: 13px; color: #aaa;">爆頭率: ${m.hs_rate}</div>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error("無法載入歷史對戰:", err);
      }
    }
  </script>
</body>
</html>
